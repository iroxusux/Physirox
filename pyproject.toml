[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physirox"
version = "1.0.3"
authors = [
  { name="Brian LaFond", email="Brian.L.LaFond@gmail.com" },
]
description = "Pyrox physics engine."
readme = "README.md"
requires-python = ">=3.13.9"
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",

  # Indicate who your project is intended for
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",

  # Pick your license as you wish (see also "license" above)
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

  # Specify the Python versions you support here.
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pyrox @ git+https://github.com/iroxusux/Pyrox.git@main",
  "pyinstaller==6.15.0",
  "pytest",
  "PyQt6",
]

license = {file = "LICENSE"}
keywords = ["python", "qt6", "api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
include = ["physirox/**"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s | %(name)s | %(levelname)s | %(message)s"
log_cli_date_format = "%m/%d/%Y, %H:%M:%S"

[tool.pylint.main]
jobs = 0
py-version = "3.13.9"
extension-pkg-allow-list = [
    "lxml",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "line-too-long",
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "db", "pk"]

[tool.pylint.reports]
# Simplify console output by disabling the long text report summary
reports = "no"

[project.urls]
Homepage = "https://github.com/iroxusux/Physirox"
Issues = "https://github.com/iroxusux/Physirox/issues"